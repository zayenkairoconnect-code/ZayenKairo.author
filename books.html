<style>
/* Read More / Read Less — direct page-level styling */

body.books-page button.description-toggle {
  all: unset !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 10px !important;
  margin-top: 13px !important;
  padding: 0 0 6px !important;

  color: #34483d !important;
  background: transparent !important;
  border: none !important;
  border-bottom: 1px solid #b49a6d !important;
  border-radius: 0 !important;
  box-shadow: none !important;

  font-family: "DM Sans", sans-serif !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  letter-spacing: 0.13em !important;
  line-height: 1.4 !important;
  text-transform: uppercase !important;

  cursor: pointer !important;
  transition: color .25s ease !important;
}

body.books-page button.description-toggle span {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 21px !important;
  height: 21px !important;
  border: 1px solid rgba(52,72,61,.35) !important;
  border-radius: 50% !important;
  color: #718572 !important;
  font-size: 13px !important;
  line-height: 1 !important;
  transition: .25s ease !important;
}

body.books-page button.description-toggle:hover {
  color: #92764d !important;
}

body.books-page button.description-toggle:hover span {
  background: #34483d !important;
  border-color: #34483d !important;
  color: #f3f0e7 !important;
}

body.books-page button.description-toggle:focus-visible {
  outline: 2px solid #b49a6d !important;
  outline-offset: 4px !important;
}
</style>
